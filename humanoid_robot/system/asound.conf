# Humanoid Robot: MAX98357A I2S amplifier is the default sound output.
# Installed as /etc/asound.conf by system/install.sh. The MAX98357A is card 0
# because onboard and HDMI audio are switched off in config.txt.
# Volume:  amixer set PCM 80%   (works after the first sound has played)

pcm.speaker {
    type hw
    card 0
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "speaker"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 44100
        channels 2
    }
}

ctl.dmixer {
    type hw
    card 0
}

pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control {
        name "PCM"
        card 0
    }
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card 0
}
