# Humanoid Robot: let systemd feed the Pi's hardware watchdog.
# If the Pi ever freezes, it reboots by itself after ~14 seconds. This is safe
# because in protected mode nothing on the SD card is being written.
# Installed as /etc/systemd/system.conf.d/humanoid-robot-watchdog.conf
[Manager]
RuntimeWatchdogSec=14
RebootWatchdogSec=2min
